<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Tinker-Vote Login</title>
</head>

<body>

    <header>
        <nav class="d-flex align-items-center gap-4 p-3">
            <img src="TinkerVote.png" alt="TinkerVote Logo" style="height: 50px;">

            <a href="https://github.com/jonasbarzee/build-showcase" class="ms-auto btn btn-primary">Jonas Barzee - My Github Repo</a>
        </nav>
    </header>

    <main>
        <section>
            <!--Username and password input boxes-->
            <form action="/trending.html">
                <fieldset>
                    <div class="continer">
                        <div class="row justify-content-center">
                            <div class="col-md-6 col-lg-4">
                                <h2>Login</h2>
                                    <div class="mb-3">
                                        <!-- Includes validation-->
                                        <label for="username" class="form-label">Username</label>
                                        <input type="text" id="username" name="username" autocomplete="username" placeholder="required"
                                            required class="form-control" />
                                    </div>

                                    <div class="mb-3">
                                        <label for="password" class="form-label">Password</label>
                                        <input type="password" id="password" name="password" required pattern="[^\s]+"
                                            placeholder="required" aria-describedby="hint" autocomplete="current-password" class="form-control"/>
                                        <p id="hint">Password cannot include any spaces</p>
                                        <p>This section is my login placeholder as it doesn't authenticate through a database yet
                                        </p>
                                        <button type="submit" class="btn btn-primary"> sign in </button>
                                    </div>
                            </div>
                        </div>
                    </div>
                </fieldset>

                <!-- Submit form with POST method and enctype="multipart/form-data" to send file contents. -->
            </form>
        </section>
    </main>
</body>

</html>
