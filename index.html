<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Swanky+and+Moo+Moo&display=swap');

        .swanky-and-moo-moo-regular {
            font-family: "Swanky and Moo Moo", cursive;
            font-weight: 400;
            font-style: regular;
        }

        body {
            font-family: "Swanky and Moo Moo", cursive;
        }
    </style>


    <title>Tinker-Vote Login</title>
</head>

<body>
    <header>
        <img src="TinkerVote.png" alt="TinkerVote Logo">
        <h2>
            <a href="https://github.com/jonasbarzee/build-showcase"> Jonas Barzee - My Github Repo</a>
        </h2>
    </header>

    <main>
        <section>
            <h2>Login</h2>
            <!--Username and password input boxes-->
            <form action="/trending.html">
                <fieldset>
                    <legend>Account</legend>
                    <div>
                        <div>
                            <!-- Includes validation-->
                            <label for="username">Username: </label>
                            <input type="text" id="username" name="username" autocomplete="username"
                                placeholder="required" required />
                        </div>
                        <div>
                            <label for="password">Password: </label>
                            <input type="password" id="password" name="password" required pattern="[^\s]+"
                                placeholder="required" aria-describedby="hint" autocomplete="current-password" />
                            <p id="hint">Password cannot include any spaces</p>
                            <p>This section is my login placeholder as it doesn't authenticate through a database yet</p>
                        </div>
                    </div>
                    <div>

                </fieldset>
                <!-- Submit form with POST method and enctype="multipart/form-data" to send file contents. -->
                <button type="submit">sign in</button>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
